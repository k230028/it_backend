# 내부망 로컬 개발 환경 — ESSO 통신이 가능한 개발자 PC 전용입니다.
# 활성화: SPRING_PROFILES_ACTIVE=local-int (또는 --spring.profiles.active=local-int)

# ── 비밀값 (로컬 편의 기본값) ──────────────────────────────────────────────
# 환경변수가 있으면 우선 사용하고, 없으면 로컬 개발용 기본값으로 동작합니다.
# 운영 비밀값과 무관한 개발 전용 값입니다.
spring.datasource.password=${DB_PASSWORD:kdb1234!!}
jwt.secret=${JWT_SECRET:kdb-it-secret-key-for-jwt-token-generation-and-validation-must-be-at-least-256-bits}

# ── Flyway — 로컬에서만 자동 적용 ─────────────────────────────────────────
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# ── 개발 편의 기능 ON ─────────────────────────────────────────────────────
app.cookie.secure=false
app.dev.user-switch.enabled=true

# CORS — 로컬 프론트(3000) / E2E(3002)
cors.allowed-origins=http://localhost,http://localhost:3000,http://localhost:3002

# SQL 출력 (로컬 디버깅 편의)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── SSO — 내부망은 ESSO 실연동 ────────────────────────────────────────────
sso.mock-enabled=false
sso.browser-base-url=${SSO_BROWSER_BASE_URL:https://dintesso.kdb.co.kr:20443}
sso.host-base-url=${SSO_HOST_BASE_URL:${SSO_BROWSER_BASE_URL:https://dintesso.kdb.co.kr:20443}}
sso.agent-id=${SSO_AGENT_ID:}
