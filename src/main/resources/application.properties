spring.application.name=it

# Oracle Database Configuration
spring.datasource.url=jdbc:oracle:thin:@127.0.0.1:1521/XEPDB1
spring.datasource.username=ITPAPP
spring.datasource.password=${DB_PASSWORD:kdb1234!!}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Logging — 운영: WARN 이상만. 개발 시 TRACE 필요하면 application-dev.properties에서 오버라이드
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# JWT Configuration
jwt.secret=${JWT_SECRET:kdb-it-secret-key-for-jwt-token-generation-and-validation-must-be-at-least-256-bits}
jwt.access-token-validity=900000
jwt.refresh-token-validity=604800000

# Cookie Configuration
# 쿠키 Secure 플래그 (개발: false, 운영: true)
app.cookie.secure=false

# Frontend URL — SSO 완료 후 리다이렉트 대상 (운영: 빈 값으로 두면 상대경로 사용)
app.frontend-url=
# SSO 완료 API의 eno 직접 전달 허용 여부 (운영 기본: false)
app.sso.allow-direct-eno=false

# CORS Configuration
# 개발 환경: http://localhost:3000 (프론트엔드 일반), http://localhost:3002 (E2E 테스트)
# 운영 환경: 실제 프론트엔드 도메인으로 변경 (예: https://itportal.kdb.com)
cors.allowed-origins=http://localhost,http://localhost:3000,http://localhost:3002

# File Upload Configuration
# 서버 인스턴스 ID: 1번 서버 = SVR1, 2번 서버 = SVR2 (서버마다 다르게 설정)
# → 서버파일명 채번 시 접두어로 사용하여 멀티 서버 파일명 충돌 방지
app.server.instance-id=SVR1
# 파일 저장 기본 경로: 운영 환경에서는 공유 NAS 경로 권장 (예: /mnt/nas/files)
app.file.base-path=C:/data/files
# 업로드 허용 최대 파일 크기 (단일 파일)
spring.servlet.multipart.max-file-size=50MB
# 업로드 허용 최대 요청 크기 (다건 업로드 포함)
spring.servlet.multipart.max-request-size=200MB

# Gemini API Configuration
# API 키는 환경변수 GEMINI_API_KEY에서 읽어옵니다.
# 환경변수 설정 예시 (Windows): set GEMINI_API_KEY=your-api-key-here
# 환경변수 설정 예시 (Linux/Mac): export GEMINI_API_KEY=your-api-key-here
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com
