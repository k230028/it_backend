spring.application.name=it

# 서비스 포트 (전 프로파일 공통)
server.port=28080

# 리다이렉트 Location을 상대 경로 그대로 내보냅니다(전 프로파일 공통).
# Spring Boot 기본값(false)은 Tomcat이 sendRedirect("/경로")를 요청의 scheme/Host로 절대화하는데,
# WebtoB→WAS 구간 Host가 localhost:28080이면 SSO 복귀가 http://localhost:28080/... 로 나가
# 사용자 PC에서 접속 불가·혼합 콘텐츠 경고가 발생합니다. 상대 Location은 브라우저가 현재
# 공개 URL 기준으로 해석하므로 프록시 헤더 설정 없이도 올바른 호스트로 복귀합니다.
server.tomcat.use-relative-redirects=true

# ── 활성 프로파일 ──────────────────────────────────────────────────────────
# 환경변수 SPRING_PROFILES_ACTIVE 로 지정합니다 (local-ext | local-int | dev | prod).
#   외부망 로컬 : SPRING_PROFILES_ACTIVE=local-ext
#   내부망 로컬 : SPRING_PROFILES_ACTIVE=local-int
#   개발 서버 : SPRING_PROFILES_ACTIVE=dev
#   운영 서버 : SPRING_PROFILES_ACTIVE=prod
# 베이스(본 파일)는 모든 프로파일에 공통 적용되며, 보안 토글은 "안전한 기본값"을 둡니다.
# 개발 편의 기능은 local-ext/local-int/dev 프로파일에서 명시적으로 활성화합니다.

# Oracle Database Configuration
# 기본 접속 = 로컬 개발 DB. 운영은 prod 프로파일에서 오버라이드합니다.
spring.datasource.url=jdbc:oracle:thin:@127.0.0.1:11521/XEPDB1
spring.datasource.username=ITPAPP
# 비밀값: 기본값 없음 — 각 프로파일(local/dev/prod)에서 주입. 미주입 시 기동 차단.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# 스키마 분리 (전 환경 공통): 접속 계정은 ITPAPP, 테이블/시퀀스 소유 스키마는 ITPOWN.
# CURRENT_SCHEMA 전환으로 JPA 매핑 테이블과 네이티브 쿼리(하드코딩 테이블명 다수)를
# 코드 수정 없이 ITPOWN.* 객체로 해석시킵니다. (hibernate.default_schema는 네이티브 쿼리에 미적용)
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET CURRENT_SCHEMA=${DB_SCHEMA:ITPOWN}

# JPA / Hibernate (공통)
spring.jpa.show-sql=false
# none(스키마 체크 안함), validate(스키마 검증)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Flyway 마이그레이션 (로컬 전용 기본 설정)
# Gradle processResources가 ../it_database/migrations/*.sql을 classpath:db/migration에 포함합니다.
# dev/prod는 DBA가 직접 적용하므로 베이스에서는 비활성화하고 local-ext/local-int에서만 켭니다.
spring.flyway.enabled=false
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.user=${FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${FLYWAY_PASSWORD:${spring.datasource.password}}
spring.flyway.default-schema=${DB_SCHEMA:ITPOWN}
spring.flyway.schemas=${DB_SCHEMA:ITPOWN}
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:20260620.001}
spring.flyway.baseline-description=Baseline existing ITPOWN schema through V20260620_001
spring.flyway.table=FLYWAY_SCHEMA_HISTORY

# Logging — 공통 기본: WARN. 개발 프로파일에서 TRACE 로 오버라이드.
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# EAI 요청/응답 전문 상세 로그 — 기본 INFO(=상세 꺼짐). DEBUG 로 올리면 성공 건까지 전문을 필드 단위로 남긴다.
# 전송 실패 건은 이 설정과 무관하게 EaiService 가 같은 덤프를 WARN 으로 남긴다.
logging.level.com.kdb.it.infra.eai.wire=${EAI_WIRE_LOG_LEVEL:INFO}

# ── Actuator (감사 실패 메트릭 노출) ─────────────────────────────────────────
# HTTP 로 노출할 엔드포인트는 health, metrics 만 허용한다. (ERR-06 감사 실패 탐지)
# health 는 공개, 그 외 Actuator(metrics 포함)는 SecurityConfig 에서 관리자 전용으로 제한한다.
management.endpoints.web.exposure.include=health,metrics

# JWT Configuration (공통 유효시간)
# 비밀값: 기본값 없음 — 각 프로파일에서 주입. 미주입 시 기동 차단.
jwt.secret=${JWT_SECRET}
jwt.access-token-validity=900000
jwt.refresh-token-validity=604800000

# ── 보안 토글: 안전한 기본값(운영 기준) ────────────────────────────────────
# 프로파일이 누락되어도 위험하지 않도록 기본을 보수적으로 설정합니다.
# 쿠키 Secure 플래그 — 운영 true 고정. local/dev 에서만 false 로 완화.
app.cookie.secure=true
# 개발 편의용 사용자 전환 API(DevAuthController) — 기본 비활성. local/dev 에서만 활성화.
app.dev.user-switch.enabled=false
# SSO 완료 API의 eno 직접 전달 — 항상 비활성.
app.sso.allow-direct-eno=false
# Authorization: Bearer 헤더 폴백 — 운영 기본 차단(쿠키 전용). dev/swagger 프로파일만 활성.
app.auth.allow-bearer-header=false
# Refresh Token 회전 직후 동시 새로고침 허용 grace(초). 이 기간 내 회전 토큰 재제출은 패밀리 폐기 없이 거부.
app.auth.refresh-rotation-grace-seconds=30
# Frontend URL — SSO 완료 후 리다이렉트 대상. APP_FRONTEND_URL 환경변수로 주입(미설정 시 빈값=거부).
app.frontend-url=${APP_FRONTEND_URL:}
# CORS 허용 오리진 — 별도 CORS_ALLOWED_ORIGINS가 없으면 app.frontend-url을 그대로 사용.
# → 프론트 URL 환경변수(APP_FRONTEND_URL) 하나만 지정하면 SSO 복귀와 CORS가 함께 맞춰진다.
#   여러 오리진이 필요할 때만 CORS_ALLOWED_ORIGINS(콤마 구분)로 따로 오버라이드.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-url}}
# 신뢰 프록시 IP(CSV) — 비어 있으면 X-Forwarded-For 미신뢰. 운영 Nginx 등에서 지정.
app.trusted-proxies=

# ── SSO (KDB ESSO ISign+ Web Agent 연동) ────────────────────────────────
# 모의 모드: true면 ESSO 통신 없이 mock 사번으로 로그인(외부망 개발용). 운영/기본은 false.
sso.mock-enabled=false
sso.mock-eno=K140024
# ESSO 기준 URL — PC(브라우저)용 / 업무서버(AP)용. 망 분리 시 다를 수 있음. 운영은 prod에서 주입.
sso.browser-base-url=${SSO_BROWSER_BASE_URL:}
sso.host-base-url=${SSO_HOST_BASE_URL:}
# 업무 시스템 고유 번호(SSO 관리자 발급). 인증 결과에서 추출할 사용자 데이터 키(기본 id=사번).
sso.agent-id=${SSO_AGENT_ID:}
sso.request-data=id
# ESSO 통신 타임아웃(ms)
sso.connect-timeout=5000
sso.read-timeout=5000

# MFA provider configuration
app.mfa.endpoint=
app.mfa.site-id=${MFA_SITE_ID:SIT01KDBBANK00000000}
app.mfa.svc-id=${MFA_SVC_ID:SVC12SIT01KDBBANK000}
app.mfa.connect-timeout=5s
app.mfa.read-timeout=5s
app.mfa.mock-enabled=false
app.mfa.challenge-ttl=90s
app.mfa.max-failures=5
# jpa(기본, TPRMPP_CMFATM/CMFADM 필요, 다중 인스턴스 지원) | memory(단일 인스턴스, 재시작 시 유실)
app.mfa.store=jpa
# 지정맥인증 서버와 공유하는 고정키. 비밀값이므로 기본값을 두지 않는다.
app.mfa.finger-vein-fixed-key=${MFA_FINGER_VEIN_FIXED_KEY:}

# File Upload Configuration (공통)
# 서버 인스턴스 ID: 1번 서버 = SVR1, 2번 서버 = SVR2 (서버마다 다르게 설정)
# → 서버파일명 채번 시 접두어로 사용하여 멀티 서버 파일명 충돌 방지
app.server.instance-id=SVR1
# 파일 저장 기본 경로: 프로파일 누락 시에도 서버 공통 데이터 경로를 사용
app.file.base-path=/dat/springitp
# 업로드 허용 최대 파일 크기 (단일 파일)
spring.servlet.multipart.max-file-size=50MB
# 업로드 허용 최대 요청 크기 (다건 업로드 포함)
spring.servlet.multipart.max-request-size=200MB

# 부점 편성요청서 반입 (/api/admin/migration/requests) 자원 한도
# 편성요청서는 서식 위주라 실측 최대가 160KB 수준이므로 파일당 10MB면 충분하다.
# 시트/행 상한은 서식만 남은 빈 행(실측 65,535행)과 자원 폭탄을 함께 막는다.
# min-inflate-ratio는 .xlsx(zip) 압축 폭탄 차단용 POI 설정이다.
app.migration.request.max-file-bytes=10485760
app.migration.request.max-files-per-batch=50
app.migration.request.max-sheets=20
app.migration.request.max-rows-per-sheet=5000
app.migration.request.min-inflate-ratio=0.01

# Gemini API Configuration (공통)
# API 키는 환경변수 GEMINI_API_KEY 에서 읽어옵니다.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com

# ── EAI (KDB 표준전문 발송) ─────────────────────────────────────────────
# 공통 기본: 전송 비활성(전문 빌드·로깅만). 환경변수 EAI_ENABLED로 활성화 여부를 주입한다.
eai.enabled=${EAI_ENABLED:false}
eai.gwe.if-id=${EAI_GWE_IF_ID:IPPG00000001}

notification.retry.enabled=true
notification.retry.fixed-delay-ms=60000
notification.retry.max-attempts=5
notification.retry.batch-size=50
eai.url=${EAI_URL:}
# 전문 문자셋. 고정길이 필드는 이 문자셋의 바이트 길이로 패딩되므로 EAI 규격과 일치해야 한다.
# 현행 EAI 게이트웨이 규격은 UTF-8 이다. 다른 문자셋을 쓰는 인터페이스가 생기면 EAI_CHARSET 으로 지정한다.
eai.charset=${EAI_CHARSET:UTF-8}
eai.connect-timeout=3000
eai.read-timeout=3000
eai.sys-env-tc=L
# IT Portal 시스템 식별자 (확정: ITP / PRM / PP)
eai.fwdi-sys-c=ITP
eai.bz-c-s3=ITP
eai.app-c=PRM
eai.app-bz-lv1-c=PP

# WAS 로그 뷰어 (/admin/was-logs)
# 링버퍼 용량 — logback-spring.xml이 <springProperty>로 이 값을 읽어 RINGBUFFER <capacity>에 넣는다.
# 여기가 단일 출처이므로 XML을 함께 고칠 필요가 없다.
app.was-log.buffer-capacity=2000
# 인스턴스ID → 내부 호출 base URL. 서버마다 같은 목록을 갖는다
app.was-log.peers.SVR1=${WAS_LOG_PEER_SVR1:}
app.was-log.peers.SVR2=${WAS_LOG_PEER_SVR2:}
# 피어 내부 엔드포인트 공유 비밀값. 비어 있으면 내부 컨트롤러를 등록하지 않는다
# 환경변수 값에 작은따옴표를 두르지 않는다 — .properties는 인용부호를 값의 일부 문자로 그대로 읽으므로
# WAS_LOG_INTERNAL_SECRET='abc'처럼 설정하면 실제 비밀값에 따옴표가 섞여 피어가 보낸 순수 토큰과
# 영영 어긋난다(모든 피어 조회가 원인 불명의 401·peerError로 보인다).
app.was-log.internal-secret=${WAS_LOG_INTERNAL_SECRET:}
app.was-log.connect-timeout-ms=1000
app.was-log.read-timeout-ms=3000
# 런타임 레벨 오버라이드 만료 스캔 주기(ms)
app.was-log.restore-scan-ms=30000
# @Scheduled 기본 풀 크기는 1이다. 알림 재시도 작업(NotificationRetryScheduler)이 외부 전송에서 막히면
# 같은 스레드를 쓰는 로그레벨 복원이 영영 돌지 않아 임시 레벨이 TTL을 넘겨 남는다. 현재 스케줄 작업이
# 둘이므로 2로 둔다.
spring.task.scheduling.pool.size=2
