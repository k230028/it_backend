spring.application.name=it

# 서비스 포트 (전 프로파일 공통)
server.port=28080

# ── 활성 프로파일 ──────────────────────────────────────────────────────────
# 환경변수 SPRING_PROFILES_ACTIVE 로 지정합니다 (local-ext | local-int | dev | prod).
#   외부망 로컬 : SPRING_PROFILES_ACTIVE=local-ext
#   내부망 로컬 : SPRING_PROFILES_ACTIVE=local-int
#   개발 서버 : SPRING_PROFILES_ACTIVE=dev
#   운영 서버 : SPRING_PROFILES_ACTIVE=prod
# 베이스(본 파일)는 모든 프로파일에 공통 적용되며, 보안 토글은 "안전한 기본값"을 둡니다.
# 개발 편의 기능은 local-ext/local-int/dev 프로파일에서 명시적으로 활성화합니다.

# Oracle Database Configuration
# 기본 접속 = 로컬 개발 DB. 운영은 prod 프로파일에서 오버라이드합니다.
spring.datasource.url=jdbc:oracle:thin:@127.0.0.1:11521/XEPDB1
spring.datasource.username=ITPAPP
# 비밀값: 기본값 없음 — 각 프로파일(local/dev/prod)에서 주입. 미주입 시 기동 차단.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# 스키마 분리 (전 환경 공통): 접속 계정은 ITPAPP, 테이블/시퀀스 소유 스키마는 ITPOWN.
# CURRENT_SCHEMA 전환으로 JPA 매핑 테이블과 네이티브 쿼리(하드코딩 테이블명 다수)를
# 코드 수정 없이 ITPOWN.* 객체로 해석시킵니다. (hibernate.default_schema는 네이티브 쿼리에 미적용)
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET CURRENT_SCHEMA=${DB_SCHEMA:ITPOWN}

# JPA / Hibernate (공통)
spring.jpa.show-sql=false
# none(스키마 체크 안함), validate(스키마 검증)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Flyway 마이그레이션 (로컬 전용 기본 설정)
# Gradle processResources가 ../it_database/migrations/*.sql을 classpath:db/migration에 포함합니다.
# dev/prod는 DBA가 직접 적용하므로 베이스에서는 비활성화하고 local-ext/local-int에서만 켭니다.
spring.flyway.enabled=false
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.user=${FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${FLYWAY_PASSWORD:${spring.datasource.password}}
spring.flyway.default-schema=${DB_SCHEMA:ITPOWN}
spring.flyway.schemas=${DB_SCHEMA:ITPOWN}
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:20260620.001}
spring.flyway.baseline-description=Baseline existing ITPOWN schema through V20260620_001
spring.flyway.table=FLYWAY_SCHEMA_HISTORY

# Logging — 공통 기본: WARN. 개발 프로파일에서 TRACE 로 오버라이드.
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# JWT Configuration (공통 유효시간)
# 비밀값: 기본값 없음 — 각 프로파일에서 주입. 미주입 시 기동 차단.
jwt.secret=${JWT_SECRET}
jwt.access-token-validity=900000
jwt.refresh-token-validity=604800000

# ── 보안 토글: 안전한 기본값(운영 기준) ────────────────────────────────────
# 프로파일이 누락되어도 위험하지 않도록 기본을 보수적으로 설정합니다.
# 쿠키 Secure 플래그 — 운영 true 고정. local/dev 에서만 false 로 완화.
app.cookie.secure=true
# 개발 편의용 사용자 전환 API(DevAuthController) — 기본 비활성. local/dev 에서만 활성화.
app.dev.user-switch.enabled=false
# SSO 완료 API의 eno 직접 전달 — 항상 비활성.
app.sso.allow-direct-eno=false
# Frontend URL — SSO 완료 후 리다이렉트 대상. APP_FRONTEND_URL 환경변수로 주입(미설정 시 빈값=거부).
app.frontend-url=${APP_FRONTEND_URL:}
# CORS 허용 오리진 — 별도 CORS_ALLOWED_ORIGINS가 없으면 app.frontend-url을 그대로 사용.
# → 프론트 URL 환경변수(APP_FRONTEND_URL) 하나만 지정하면 SSO 복귀와 CORS가 함께 맞춰진다.
#   여러 오리진이 필요할 때만 CORS_ALLOWED_ORIGINS(콤마 구분)로 따로 오버라이드.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-url}}
# 신뢰 프록시 IP(CSV) — 비어 있으면 X-Forwarded-For 미신뢰. 운영 Nginx 등에서 지정.
app.trusted-proxies=

# ── SSO (KDB ESSO ISign+ Web Agent 연동) ────────────────────────────────
# 모의 모드: true면 ESSO 통신 없이 mock 사번으로 로그인(외부망 개발용). 운영/기본은 false.
sso.mock-enabled=false
sso.mock-eno=K140024
# ESSO 기준 URL — PC(브라우저)용 / 업무서버(AP)용. 망 분리 시 다를 수 있음. 운영은 prod에서 주입.
sso.browser-base-url=${SSO_BROWSER_BASE_URL:}
sso.host-base-url=${SSO_HOST_BASE_URL:}
# 업무 시스템 고유 번호(SSO 관리자 발급). 인증 결과에서 추출할 사용자 데이터 키(기본 id=사번).
sso.agent-id=${SSO_AGENT_ID:}
sso.request-data=id
# ESSO 통신 타임아웃(ms)
sso.connect-timeout=5000
sso.read-timeout=5000

# File Upload Configuration (공통)
# 서버 인스턴스 ID: 1번 서버 = SVR1, 2번 서버 = SVR2 (서버마다 다르게 설정)
# → 서버파일명 채번 시 접두어로 사용하여 멀티 서버 파일명 충돌 방지
app.server.instance-id=SVR1
# 파일 저장 기본 경로: 로컬(local-ext/local-int) 기본값. dev/prod는 각 프로파일에서 오버라이드.
app.file.base-path=c:/itp_file
# 업로드 허용 최대 파일 크기 (단일 파일)
spring.servlet.multipart.max-file-size=50MB
# 업로드 허용 최대 요청 크기 (다건 업로드 포함)
spring.servlet.multipart.max-request-size=200MB

# Gemini API Configuration (공통)
# API 키는 환경변수 GEMINI_API_KEY 에서 읽어옵니다.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com

# ── EAI (KDB 표준전문 발송) ─────────────────────────────────────────────
# 공통 기본: 전송 비활성(전문 빌드·로깅만). 운영은 prod 프로파일에서 활성화 + URL 주입.
eai.enabled=false
eai.url=${EAI_URL:}
eai.charset=MS949
eai.connect-timeout=3000
eai.read-timeout=3000
eai.sys-env-tc=L
# IT Portal 시스템 식별자 (확정: IPP / PRM / PP)
eai.fwdi-sys-c=IPP
eai.bz-c-s3=IPP
eai.app-c=PRM
eai.app-bz-lv1-c=PP
