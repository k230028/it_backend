# 외부망 로컬 개발 환경 — ESSO 통신이 불가능한 개발자 PC 전용입니다.
# 활성화: SPRING_PROFILES_ACTIVE=local-ext (또는 --spring.profiles.active=local-ext)

# ── 비밀값 (로컬 편의 기본값) ──────────────────────────────────────────────
# 환경변수가 있으면 우선 사용하고, 없으면 로컬 개발용 기본값으로 동작합니다.
# 운영 비밀값과 무관한 개발 전용 값입니다.
spring.datasource.password=${DB_PASSWORD:kdb1234!!}
jwt.secret=${JWT_SECRET:kdb-it-secret-key-for-jwt-token-generation-and-validation-must-be-at-least-256-bits}

# ── Flyway — 로컬에서만 자동 적용 ─────────────────────────────────────────
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# VSCode/Eclipse 실행은 bin/main에서 구동되며 Gradle processResources(db/migration 복사)를
# 거치지 않아 classpath:db/migration이 비어 있다. 소스 디렉토리를 직접 읽도록 filesystem 사용.
# (VSCode·gradlew bootRun 모두 작업 디렉토리가 it_backend라 ../it_database/migrations로 해석됨.)
spring.flyway.locations=${FLYWAY_LOCATIONS:filesystem:../it_database/migrations}

# ── 개발 편의 기능 ON ─────────────────────────────────────────────────────
app.cookie.secure=false
app.dev.user-switch.enabled=true

# Frontend/CORS — APP_FRONTEND_URL 하나로 SSO 복귀 대상과 CORS 허용 오리진을 함께 설정.
# 미설정 시 로컬 기본값(프론트 3000 / E2E 3002). 내부망 IP 테스트는 APP_FRONTEND_URL=http://<IP>:3000 지정
# → SSO 복귀와 CORS가 함께 그 origin으로 맞춰짐. 다중 오리진은 CORS_ALLOWED_ORIGINS로 CORS만 오버라이드.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${APP_FRONTEND_URL:http://localhost,http://localhost:3000,http://localhost:3002}}

# SQL 출력 (로컬 디버깅 편의)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── SSO — 외부망은 모의 모드(ESSO 통신 없이 mock 사번 로그인) ──────────────
sso.mock-enabled=true
sso.mock-eno=K140024
