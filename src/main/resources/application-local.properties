# 로컬 개발 환경 — 개발자 PC 전용. 운영 서버에는 절대 적용하지 않습니다.
# 활성화: SPRING_PROFILES_ACTIVE=local (또는 --spring.profiles.active=local)

# ── 비밀값 (로컬 편의 기본값) ──────────────────────────────────────────────
# 환경변수가 있으면 우선 사용하고, 없으면 로컬 개발용 기본값으로 동작합니다.
# 운영 비밀값과 무관한 개발 전용 값입니다.
spring.datasource.password=${DB_PASSWORD:kdb1234!!}
jwt.secret=${JWT_SECRET:kdb-it-secret-key-for-jwt-token-generation-and-validation-must-be-at-least-256-bits}

# ── 개발 편의 기능 ON ─────────────────────────────────────────────────────
app.cookie.secure=false
app.dev.user-switch.enabled=true

# CORS — 로컬 프론트(3000) / E2E(3002)
cors.allowed-origins=http://localhost,http://localhost:3000,http://localhost:3002

# SQL 출력 (로컬 디버깅 편의)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
