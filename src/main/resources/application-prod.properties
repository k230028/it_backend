# 운영 환경 오버라이드.
# 활성화: SPRING_PROFILES_ACTIVE=prod (또는 --spring.profiles.active=prod)
#
# 모든 비밀값은 환경변수로만 주입합니다 — 기본값 없음.
# 환경변수 미설정 시 EnvironmentValidator/플레이스홀더 해석 단계에서 기동이 차단됩니다(의도된 안전장치).

# ── Oracle Database (운영 DB) ─────────────────────────────────────────────
# 실제 운영 DB 호스트/서비스로 교체하거나 DB_URL 환경변수로 주입하세요.
# 이름 세 가지가 서로 다릅니다 — 접속 계정 ITPAPP, 객체 소유 스키마 ITPOWN, DB 서비스명 PPRMDB.
# URL 끝(또는 SERVICE_NAME)에 오는 것은 서비스명이고, 스키마는 아래 connection-init-sql이 전환합니다.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//db-host:11521/PPRMDB}
#
# RAC 2노드 · AP 2대 운영: DB_URL을 AP마다 다르게 주입해 접속을 두 노드에 나눠 붙입니다.
# 채택한 방식은 두 DB 주소를 ADDRESS_LIST에 넣고 AP마다 순서를 교차하는 것입니다.
# AP별 실제 값은 README「인스턴스별 환경변수(RAC 2노드)」가 SoT입니다.
#
#   AP1 = 1번 노드 우선 / 2번 노드 예비, AP2 = 그 반대. 두 URL은 ADDRESS 순서만 다릅니다.
#   LOAD_BALANCE=OFF가 앞 주소 고정을, FAILOVER=ON이 뒤 주소로의 자동 전환을 담당하므로
#   둘 다 명시해야 합니다. 빠뜨리면 Oracle이 두 주소를 무작위로 골라 교차 배분이 무너집니다.
#
#   AP1 (실제 주입은 줄바꿈·공백 없이 한 줄):
#     jdbc:oracle:thin:@(DESCRIPTION=(CONNECT_TIMEOUT=5)(RETRY_COUNT=3)(RETRY_DELAY=1)
#       (ADDRESS_LIST=(LOAD_BALANCE=OFF)(FAILOVER=ON)
#         (ADDRESS=(PROTOCOL=TCP)(HOST=db1-ip)(PORT=11521))
#         (ADDRESS=(PROTOCOL=TCP)(HOST=db2-ip)(PORT=11521)))
#       (CONNECT_DATA=(SERVICE_NAME=PPRMDB)))
#   AP2: 위에서 db2-ip를 먼저, db1-ip를 뒤에 둡니다.
#
#   받은 주소가 노드 VIP인지 물리 IP인지 확인해야 합니다. VIP는 노드가 죽으면 살아있는 노드가
#   넘겨받아 즉시 거절 응답을 주므로 두 번째 주소로 곧바로 넘어가지만, 물리 IP는 아무 응답이
#   없어 CONNECT_TIMEOUT(위 예시 5초)을 다 기다린 뒤에야 전환합니다.
#
#   주소를 교차해도 노드가 반드시 고정되지는 않습니다. 노드 리스너가 서버 사이드 로드밸런싱으로
#   다른 인스턴스에 넘길 수 있고, LOAD_BALANCE=OFF는 클라이언트 쪽 주소 선택만 끕니다. 배포 후
#   gv$session의 inst_id별 세션 수로 실제 분포를 확인합니다(확인 쿼리는 README에 있습니다).
#
# 커넥션풀 한계: Hikari는 FAN(ONS)을 구독하지 않으므로 노드 장애를 통보로 즉시 알지 못하고,
# 죽은 커넥션은 반납·검증·획득 시점에야 걸러집니다. 복구된 노드로 배분이 되돌아오는 것도
# 자동이 아니라 max-lifetime(기본 30분)으로 커넥션이 재생성될 때 일어납니다. 전환을 더 빨리
# 하려면 spring.datasource.hikari.max-lifetime을 줄입니다.
spring.datasource.username=${DB_USERNAME:ITPAPP}
spring.datasource.password=${DB_PASSWORD}

# 스키마 분리(접속 ITPAPP → 소유 ITPOWN)는 베이스 application.properties의
# connection-init-sql(CURRENT_SCHEMA=${DB_SCHEMA:ITPOWN})이 전 환경 공통으로 적용합니다.

# ── Flyway — 운영 DB는 DBA가 적용 ────────────────────────────────────────
spring.flyway.enabled=false

# ── JWT (환경변수 필수) ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
# 토큰 지문 HMAC 키도 별도 환경변수로만 주입한다. JWT 서명키 폴백 금지.
security.token-fingerprint-secret=${TOKEN_FINGERPRINT_SECRET}

# 전산예산 미리보기 HMAC 키는 JWT·MFA 키와 분리하며 운영 기본값을 두지 않는다.
app.approval.it-budget.preview.active-key-id=${IT_BUDGET_PREVIEW_ACTIVE_KEY_ID}
app.approval.it-budget.preview.active-signing-key=${IT_BUDGET_PREVIEW_SIGNING_KEY}
app.approval.it-budget.preview.previous-key-id=${IT_BUDGET_PREVIEW_PREVIOUS_KEY_ID:}
app.approval.it-budget.preview.previous-signing-key=${IT_BUDGET_PREVIEW_PREVIOUS_SIGNING_KEY:}
app.approval.it-budget.preview.ttl=PT30M

# ── 보안 토글 — 운영 고정 ─────────────────────────────────────────────────
app.cookie.secure=true
# 외부 TLS 종료 뒤 내부 HTTP로 전달되어도 SSO 검증 세션 쿠키는 항상 보안 속성을 유지한다.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.auth.allow-bearer-header=false
app.dev.user-switch.enabled=false
app.sso.allow-direct-eno=false
# 운영에서는 API 명세와 Swagger UI를 외부에 노출하지 않는다.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── CORS / Frontend — 실제 운영 도메인 ────────────────────────────────────
# 프론트 URL(APP_FRONTEND_URL) 하나로 SSO 복귀와 CORS를 함께 맞춘다.
# CORS에 여러 오리진이 필요할 때만 CORS_ALLOWED_ORIGINS로 따로 오버라이드.
app.frontend-url=${APP_FRONTEND_URL:https://itp.kdb.co.kr:20443}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-url}}
# 신뢰 프록시 IP(CSV) — 운영 Nginx 등 X-Forwarded-For 설정 주체 IP 주입.
app.trusted-proxies=${APP_TRUSTED_PROXIES:}

# ── 파일 저장 — 운영 공유 경로(NAS 등) ────────────────────────────────────
app.file.base-path=${FILE_BASE_PATH:/dat/springitp}
app.server.instance-id=${SERVER_INSTANCE_ID:SVR1}

# ── EAI — 운영 전송 활성화 (URL 환경변수 필수) ────────────────────────────
eai.enabled=${EAI_ENABLED:true}
eai.url=${EAI_URL}

# ── 로깅 — 운영은 WARN 유지(베이스), SQL 미출력 ──────────────────────────
spring.jpa.show-sql=false

# ── SSO — 운영 실연동 (ESSO ISign+ Web Agent) ─────────────────────────────
# 모의 모드 비활성. ESSO URL/agentId는 환경변수로 주입(SSO 관리자 발급).
#   내부망 예: SSO_BROWSER_BASE_URL=https://dintesso.kdb.co.kr:20443
#   인터넷망(스마트워크)은 dextesso / dessej01 세트로 분리 주입.
sso.mock-enabled=false
sso.browser-base-url=${SSO_BROWSER_BASE_URL:https://intesso.kdb.co.kr:20443}
sso.host-base-url=${SSO_HOST_BASE_URL:${SSO_BROWSER_BASE_URL:https://intesso.kdb.co.kr:20443}}
sso.agent-id=${SSO_AGENT_ID:230}

app.mfa.mock-enabled=false
app.mfa.endpoint=https://opsap.kdb.co.kr:20443/interfBiz/processRequest.do
