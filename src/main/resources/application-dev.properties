# 개발(공유 dev 서버) 환경 오버라이드 — 운영 서버에는 절대 적용하지 않습니다.
# 활성화: SPRING_PROFILES_ACTIVE=dev (또는 --spring.profiles.active=dev)

# ── 비밀값 (개발 서버 편의 기본값) ────────────────────────────────────────
# 환경변수가 있으면 우선 사용. 운영 비밀값과 무관한 개발 전용 값입니다.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//db-host:11521/ITPOWN}
spring.datasource.username=${DB_USERNAME:ITPAPP}
spring.datasource.password=${DB_PASSWORD:kdb1234!!}
jwt.secret=${JWT_SECRET:kdb-it-secret-key-for-jwt-token-generation-and-validation-must-be-at-least-256-bits}

# ── Flyway — dev DB는 DBA가 적용 ─────────────────────────────────────────
spring.flyway.enabled=false

# ── 개발 편의 기능 ────────────────────────────────────────────────────────
app.cookie.secure=false
app.dev.user-switch.enabled=true
# Frontend/CORS — APP_FRONTEND_URL 하나로 SSO 복귀 대상과 CORS 허용 오리진을 함께 설정(미설정 시 로컬 기본값).
# 다중 오리진은 CORS_ALLOWED_ORIGINS(콤마 구분)로 CORS만 오버라이드.
app.frontend-url=${APP_FRONTEND_URL:https://ditp.kdb.co.kr:20443}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${APP_FRONTEND_URL:https://ditp.kdb.co.kr:20443}}

# ── 파일 저장 경로 (개발 서버) ────────────────────────────────────────────
app.file.base-path=${FILE_BASE_PATH:/dat/springitp}

# ── SQL/로깅 상세 ─────────────────────────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ── SSO — 외부망 개발은 모의 모드(ESSO 통신 불가 환경) ─────────────────────
sso.mock-enabled=false
sso.browser-base-url=${SSO_BROWSER_BASE_URL:http://intesso.kdb.co.kr:20080}
sso.host-base-url=${SSO_HOST_BASE_URL:${SSO_BROWSER_BASE_URL:http://intesso.kdb.co.kr:20080}}
sso.agent-id=${SSO_AGENT_ID:30}
