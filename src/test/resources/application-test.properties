# Oracle DataSource 자동 설정 제외 (단위 테스트 - DB 연결 불필요)
# Spring Boot 4 에서 auto-configuration 모듈이 분리됨 (boot-jdbc, boot-hibernate, boot-data-jpa)
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
  org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

# DB 비밀번호 — EnvironmentValidator 통과용 (실제 연결 안 함, DataSource 자동설정 제외됨)
spring.datasource.password=test-db-password-for-unit-test

# Flyway는 DB 연결이 필요한 통합 검증에서만 수동으로 켭니다.
spring.flyway.enabled=false

# JWT 테스트용 고정 시크릿 키 (256bit 이상 필수)
jwt.secret=test-secret-key-for-junit-test-minimum-256-bits-length-ok
jwt.access-token-validity=900000
jwt.refresh-token-validity=604800000

# Gemini API (테스트 환경 - 더미값으로 빈 바인딩 오류 방지)
gemini.api.key=test-dummy-key
gemini.api.model=gemini-2.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com

# 쿠키 설정
app.cookie.secure=false
app.sso.allow-direct-eno=false

# CORS
cors.allowed-origins=http://localhost:3000
