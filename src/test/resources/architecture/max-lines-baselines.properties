# 백엔드 운영 소스 800줄 초과 파일의 동결선 (CQ-01 / Wave D-1)
#
# 규칙
#   1. 여기 적힌 파일의 실제 줄 수는 기준값과 정확히 일치해야 한다 (증가·감소 모두 실패).
#   2. 여기 없는 src/main/java 파일이 800줄을 넘으면 실패한다.
#   3. 여기 적힌 경로가 실재하지 않으면 실패한다.
#
# 기능 추가로 불가피하게 초과하면 같은 PR에서 동등 이상 분량을 추출해 상쇄한다.
# 분해로 줄었으면 같은 커밋에서 기준값을 실측값으로 낮추고, 800줄 이하가 되면 항목을 지운다.
#
# 경로는 src/main/java 기준 상대 경로이며 구분자는 항상 '/'다.
# 측정 정의: Files.readAllLines(path, UTF_8).size()
#
# 기준 시점: 2026-08-05 / backend 9b5104e9
#
# 계획서 초안(task-1-brief.md)의 수치는 PowerShell `Get-Content | Measure-Object -Line`으로 측정했으나
# 이 명령은 빈 줄을 세지 않는다 — `Measure-Object -Line`이 빈 문자열의 줄 수를 0으로 계산하므로
# 파일의 빈 줄 수만큼 값이 작아진다(AdminService.java 866줄 중 빈 줄 61줄 → 805로 오집계,
# CouncilController.java 1279줄 중 빈 줄 64줄 → 1215로 오집계. 둘 다 총줄수-빈줄수와 정확히 일치).
# 인코딩 지정이나 BOM 유무와는 무관하다.
# 아래 값은 게이트와 같은 정의(Files.readAllLines(path, UTF_8).size())로 측정하고
# .NET File.ReadAllLines와 LF 바이트 수로 교차 검증했으며, 같은 커밋(9b5104e9)에서 800줄을 넘는
# 파일 2건(ApplicationService, CostDto)도 함께 등재했다.
# PowerShell로 셀 때는 `[System.IO.File]::ReadAllLines($p).Length` 또는 `(Get-Content $p).Count`를 쓴다.
