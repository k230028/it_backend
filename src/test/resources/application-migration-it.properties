# SEC-15 마이그레이션 전용 폐기 가능 Oracle 스키마 프로파일.
# 클래스 수준 opt-in과 DB marker 검증을 통과한 경우에만 테스트가 이 설정을 읽습니다.
spring.datasource.url=${SEC15_MIGRATION_DB_URL}
spring.datasource.username=${SEC15_MIGRATION_DB_USERNAME}
spring.datasource.password=${SEC15_MIGRATION_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET CURRENT_SCHEMA=${SEC15_MIGRATION_DB_SCHEMA}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=false
