// 플러그인 저장소 탐색 우선순위: 선언 순서대로 시도 (1순위 → 3순위).
// 플러그인(org.springframework.boot 등)은 기본적으로 Gradle Plugin Portal에서 받으므로,
// 내부 Nexus를 1순위로 쓰려면 마커 POM 포함 플러그인 아티팩트가 업로드되어 있어야 합니다.
// 이 블록은 반드시 파일 최상단에 위치해야 합니다.
pluginManagement {
	// Nexus 접속 가능 여부를 1초 TCP 프로브로 판정.
	// 접속 불가 환경에서 Nexus를 등록하면 연결 타임아웃 대기로 빌드가 느려지므로 닿을 때만 등록.
	def nexusReachable = {
		try {
			new Socket().withCloseable { s ->
				s.connect(new InetSocketAddress('10.6.65.151', 20080), 1000)
			}
			true
		} catch (Exception ignored) {
			false
		}
	}()

	repositories {
		// 1순위: 내부 Nexus (폐쇄망 반입 아티팩트) — 접속 가능할 때만 등록
		if (nexusReachable) {
			maven {
				url = 'http://10.6.65.151:20080/repository/maven-releases/'
				allowInsecureProtocol = true   // http이므로 필수
				// Gradle Module Metadata(.module) 미요청 — POM만으로 해석.
				// .module은 반입 신청 불가 유형이므로 저장소에 없어도 동작하도록 필수 유지.
				metadataSources {
					mavenPom()
					artifact()
					ignoreGradleMetadataRedirection()
				}
			}
		}
		// 2순위: 반입한 로컬 폴더 저장소 (make-local-maven-repo.ps1 산출물) — 폴더 존재 시에만 등록
		if (new File('C:/maven-repo').isDirectory()) {
			maven {
				url = 'file:///C:/maven-repo'
				// 미러는 Gradle 캐시를 그대로 복사한 것이라 .module을 포함합니다.
				// KMP 아티팩트(예: com.squareup.okio:okio)는 .module의 variant 리다이렉션으로만
				// 실제 JVM jar(okio-jvm)에 도달하므로, Nexus용 ignoreGradleMetadataRedirection()을
				// 여기 적용하면 존재하지 않는 okio-<ver>.jar를 찾다가 해석에 실패합니다.
				metadataSources {
					gradleMetadata()
					mavenPom()
					artifact()
				}
			}
		}
		// 3순위: Gradle Plugin Portal (외부망 가능 환경 폴백, mavenCentral 포함 역할)
		gradlePluginPortal()
		mavenCentral()
	}
}

rootProject.name = 'it'
